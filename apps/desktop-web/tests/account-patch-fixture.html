<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Account patch acceptance fixture</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react';
      import {createRoot} from 'react-dom/client';
      import {Accounts} from '/src/Accounts.tsx';
      import {APIRequestError} from '/src/api-error.js';

      const parentScopes = ['accounts:manage', 'desktop:admin', 'desktop:read', 'xelibrary:query', 'xelibrary:read'];
      const signedScopes = [...parentScopes, 'embedding:read', 'embedding:write'];
      const candidates = ['embedding:read', 'embedding:write'];
      const rows = [
        {id: 'root', parent: null, username: 'admin', name: 'Root', enabled: true, inherit_all: false,
          grants: [...parentScopes], effective_scopes: [...parentScopes], kind: 'human'},
        {id: 'child', parent: 'root', username: 'child', name: 'Child', enabled: true, inherit_all: false,
          grants: ['desktop:read', 'xelibrary:read', 'xelibrary:write'],
          effective_scopes: ['desktop:read', 'xelibrary:read'], kind: 'human'},
      ];
      window.__accountPatchCalls = [];

      async function api(path, init = {}) {
        if (path === '/users/me') return {subject: 'root', kind: 'human', scopes: signedScopes};
        if (path === '/auth/accounts/root-scope-candidates') return {candidate_scopes: [...candidates]};
        if (path.startsWith('/auth/accounts?limit=')) return rows.map(row => ({...row}));
        if (path.startsWith('/auth/api-keys?owner=')) return [];
        if (path.startsWith('/auth/accounts/') && init.method === 'PATCH') {
          const id = decodeURIComponent(path.slice('/auth/accounts/'.length));
          const body = JSON.parse(init.body);
          window.__accountPatchCalls.push({id, body});
          if (body.grants?.some(scope => !parentScopes.includes(scope) && !candidates.includes(scope))) {
            throw new APIRequestError('grants must be a subset of inherited permissions', 403, 'PERMISSION_ESCALATION');
          }
          const index = rows.findIndex(row => row.id === id);
          rows[index] = {...rows[index], ...body};
          return rows[index];
        }
        throw new Error(`Unexpected fixture API request: ${path}`);
      }

      const apiPage = async (path, init) => ({data: await api(path, init), meta: {}});
      createRoot(document.getElementById('root')).render(React.createElement(Accounts, {api, apiPage}));
    </script>
  </body>
</html>

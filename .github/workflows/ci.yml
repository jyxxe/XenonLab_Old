name: verify
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check xeonolab tests scripts
      - run: mkdir -p runtime
      - run: uv run pytest --basetemp runtime/test-tmp
      - run: uv run python scripts/smoke_services.py
      - run: uv run python scripts/verify_failure_injection.py
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code -- docs/api
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop-web/package-lock.json
      - run: npm ci
      - name: Install headless Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Set strict browser executable
        run: |
          CHROME_BIN="$(node --input-type=module -e "import {chromium} from '@playwright/test'; process.stdout.write(chromium.executablePath())")"
          test -x "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Frontend unit tests
        run: npm test
      - name: Headless browser smoke
        run: npm run test:browser-smoke
      - name: Upload browser failure evidence
        if: failure()
        uses: https://code.forgejo.org/actions/upload-artifact@v4
        with:
          name: frontend-browser-smoke-failure
          path: runtime/ci-browser-smoke/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build

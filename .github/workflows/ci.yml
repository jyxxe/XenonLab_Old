name: verify
on:
  push:
    branches: [feature/platform-v1]
  pull_request:
    branches: [feature/platform-v1]
    types: [opened, synchronize, reopened, edited]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12.13"
      - run: uv sync --locked
      - run: uv run ruff check xeonolab tests scripts
      - run: mkdir -p runtime
      - run: uv run pytest --basetemp runtime/test-tmp
      - run: uv run python scripts/smoke_services.py
      - run: uv run python scripts/verify_failure_injection.py
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code -- docs/api
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop-web
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated API browser fixtures
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12.13"
      - run: uv sync --locked
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: apps/desktop-web/package-lock.json
      - run: npm ci --no-fund --fetch-timeout=60000 --fetch-retries=2 --loglevel=verbose
      - name: Check pinned headless browser
        run: |
          CHROME_BIN=/opt/ci/browser/chrome/chrome
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Frontend unit tests
        run: npm test
      - name: Headless browser smoke
        run: npm run test:browser-smoke
      - name: Existing session, Work and shell browser regressions
        run: npm run test:browser-regression
      - name: Upload browser failure evidence
        if: failure()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: frontend-browser-failure-evidence
          path: |
            runtime/ci-browser-smoke/
            runtime/verification/issue216/
            runtime/verification/issue219/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build

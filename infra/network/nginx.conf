# Frontend and API gateway example. Terminate HTTPS before this listener.
server {
    listen 8080;
    server_name localhost;
    root /srv/xeonolab/desktop;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / { try_files $uri $uri/ /index.html; }
    location /api/v1/query { proxy_pass http://127.0.0.1:8100; }
    location /api/v1/apps { proxy_pass http://127.0.0.1:8101; }
    location /api/v1/users/ { proxy_pass http://127.0.0.1:8101; }
}

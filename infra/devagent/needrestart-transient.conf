# Keep unattended-upgrades/needrestart from restarting transient DevAgent units.
#
# Installed at /etc/needrestart/conf.d/devagent-transient.conf on the DevAgent
# host. During the 2026-10-22 unattended-upgrades window the needrestart APT hook
# restarted the running devagent-operation-* transient unit at 06:10:06, after
# the release activation had already completed. The broker then observed the
# worker exit and marked the deployment "interrupted"/recovery_required even
# though every target and the gateway had converged on the new release.
#
# Deploy and preflight units are intentionally transient (systemd-run --collect)
# and are owned by the protected broker; needrestart must not touch them.
$nrconf{override_rc}{qr(^devagent-operation-)} = 0;
$nrconf{override_rc}{qr(^devagent-preflight-)} = 0;

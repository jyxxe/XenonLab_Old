x-service: &service
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: &environment
    APP_MODE: production
    OIDC_ISSUER: ${OIDC_ISSUER:?OIDC issuer required}
    OIDC_AUDIENCE: xeonolab
    OIDC_PUBLIC_KEY: ${OIDC_PUBLIC_KEY:?RSA verification key required}
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live',timeout=2)"]
    interval: 30s
    timeout: 5s
    retries: 3
services:
  xelibrary:
    <<: *service
    environment:
      <<: *environment
      SERVICE: xelibrary
    volumes: [library:/data]
    ports: ["127.0.0.1:8100:8000"]
    mem_limit: 2g
  desktop-web:
    <<: *service
    environment:
      <<: *environment
      SERVICE: desktop-web
    volumes: [desktop:/data]
    ports: ["127.0.0.1:8101:8000"]
    mem_limit: 512m
  tool-gateway:
    <<: *service
    environment:
      <<: *environment
      SERVICE: tool-gateway
      XELIBRARY_URL: http://xelibrary:8000
    volumes: [tools:/data]
    ports: ["127.0.0.1:8102:8000"]
    mem_limit: 512m
  deploy-gateway:
    <<: *service
    environment:
      <<: *environment
      SERVICE: deploy-gateway
    volumes: [deploy:/data]
    ports: ["127.0.0.1:8103:8000"]
    mem_limit: 512m
volumes:
  library:
  desktop:
  tools:
  deploy:

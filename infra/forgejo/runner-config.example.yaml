log:
  level: info
  job_level: info
runner:
  file: /var/lib/forgejo-runner/.runner-unused
  capacity: 1
  timeout: 30m
  shutdown_timeout: 2m
  insecure: false
  fetch_interval: 5s
  env_file: ''
  envs:
    SSL_CERT_FILE: /etc/forgejo-runner/ca-bundle.crt
    GIT_SSL_CAINFO: /etc/forgejo-runner/ca-bundle.crt
    NODE_EXTRA_CA_CERTS: /etc/forgejo-runner/ca-bundle.crt
  labels:
    - ubuntu-latest:docker://LOCAL_BUILT_IMAGE_ID
cache:
  enabled: false
container:
  privileged: false
  options: --memory=3g --cpus=2 --pids-limit=512 --dns=192.168.0.105
  valid_volumes: []
  docker_host: '-'
  force_pull: false
server:
  connections:
    xeonolab:
      url: https://192.168.0.101:9445/
      uuid: REPOSITORY_RUNNER_UUID
      token_url: file:/etc/forgejo-runner/runner-token

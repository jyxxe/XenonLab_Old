[project]
name = "xeonolab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx[socks]>=0.28,<1",
    "PyJWT[crypto]>=2.10,<3",
    "lark>=1.2,<2",
    "python-multipart>=0.0.20",
    "tokenizers>=0.20,<1",
    "huggingface-hub>=1.0,<2",
    "Pillow>=11,<13",
    "cryptography>=45,<51",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110

[project.optional-dependencies]
inference = ["torch>=2.6", "tokenizers>=0.20", "safetensors>=0.4", "pyyaml>=6"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.per-file-ignores]
"scripts/export_openapi.py" = ["E402"]
"xeonolab/vendor/**" = ["ALL"]
[project.scripts]
xlctl = "xeonolab.cli:xlctl"
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.uv.sources]
torch = [{index = "pytorch-cpu", marker = "sys_platform == 'linux'"}]
